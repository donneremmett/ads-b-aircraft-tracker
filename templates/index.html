<!-- declare file as html -->
<!DOCTYPE html>

<!-- html tag wraps all page content -->
<html>
    
<!-- head tag has background data (called metadata) not visible to users -->
<head>
    <!-- text shown on tab -->
    <title>ADS-B Aircraft Tracker</title>

    <!-- Leaflet CSS and own styles go here in <style> tags -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <!-- internal CSS -->
    <style> 
        /* make sure map container (div) has a defined height (set it in CSS) */
        #map { 
            height: 600px; 
        }
    </style>
</head>

<!-- body tag has all viewable content on the page -->
<body>
    <!-- HTML content here -->
    <h1>Welcome to the ADS-B Aircraft Tracker</h1>
    <p>This application allows you to track aircraft in real-time using ADS-B data.</p>
    
    <!-- put this where want map to display -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    
     <!-- rest of JavaScript -->
    <script>
        // initialize the map and set its view to a chosen geographical coordinates and zoom level
        // by default all mouse and touch interactions on the map are enabled
        var map = L.map('map').setView([51.0447, -114.0719], 9);

        // add a tile layer to the map (OpenStreetMap tiles)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // create empty layer for aircraft markers to easily manage
        const aircraftLayerGroup = L.layerGroup().addTo(map);

        // function to fetch and display aircrafts
        async function fetchAircraftData() {
            try {
                // fetch aircraft data from the API
                const response = await fetch('http://10.0.0.14:5000/data');
                const data = await response.json();

                // process and display aircraft data on the map
                const aircraftList = data.aircraft;
                // console.log(aircraftList);

                // loop through all aircraft and add markers to the map
                for (const aircraft of aircraftList) {
                    // check if lat or lon missing and move onto next aircraft
                    if (aircraft.lat === null || aircraft.lon === null) {
                        console.log("No lat or lon");
                        continue;
                    }

                    // check if flight number is missing and replace with hex
                    if (aircraft.flight == null) {
                        console.log("No flight number, using hex");
                        aircraft.flight = aircraft.hex;
                    }

                    // create a marker for each aircraft and add to the layer group
                    const marker = L.marker([aircraft.lat, aircraft.lon]).addTo(aircraftLayerGroup);
                }

            // if cannot fetch from API, log error to console
            } catch (error) {
                console.error('Error fetching aircraft data:', error);
            }
        }

        // call the function to fetch and display aircraft data
        fetchAircraftData()
    </script>

    <!-- own JavaScript in <script> tags at bottom -->
</body>
</html>
