<!-- declare file as html -->
<!DOCTYPE html>

<!-- html tag wraps all page content -->
<html>
    
<!-- head tag has background data (called metadata) not visible to users -->
<head>
    <!-- text shown on tab -->
    <title>ADS-B Aircraft Tracker</title>

    <!-- Leaflet CSS library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <!-- internal CSS -->
    <style> 
        /* force canvas to lock edge-to-edge display */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden; /* prevents scrollbars from popping up */
        }

        #shutdown-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2500; /* highest layer */
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor:pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* change button to red when mouse over it */
        #shutdown-button:hover {
            background-color: #bd2130;
        }

        /* container for both toggle buttons */
        .toggle-container {
            position: fixed; /* does not move even when scroll */
            top: 20px;
            left: 50%;
            transform: translateX(-50%); /* shifts box to left by half its own width */
            z-index: 2000; /* puts above map, popups, details panel, and list */
            background-color: rgba(255, 255, 255, 0.9);
            padding: 8px;         
            border-radius: 8px;   
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* default style for toggle buttons */
        .toggle-button {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #007bff;
            background-color: white;
            color: #007bff;
            border-radius: 6px;
        }

        /* style for button if selected */
        .toggle-button.active {
            background-color: #007bff;
            color: white;
        }

        /* map view div, includes map and details panel */
        #map-view {
            display: block;
            position: relative; 
            width: 100vw;
            height: 100vh;
        }

        /* make sure map container (div) has a defined height (set it in CSS) */
        #map { 
            width: 100%;
            height: 100%;
            position: absolute; /* ensures not pushed by other elements */
            top: 0;
            left: 0;
            z-index: 1; /* map stays on lowest layer */
        }

        /* id selector for details panel div that stays hidden until clicked */
        #details-panel {
            display: none;
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 1000; /* forces to sit on top of map layer */
            background-color: white;
            padding: 20px;
            width: 300px;
            border: 2px solid #007bff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-family: Arial, sans-serif;
        }

        /* styling for close button */
        #close-details-button {
            float: right;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 0;
            line-height: 1;
        }

        /* change close button color to red when mouse over it */
        #close-details-button:hover {
            color: #ff0000; 
        }

        /* class to remove Leaflet's default white marker background box and borders */
        .aircraft-marker-container {
            background: none !important; /* !important used to override styling rules */
            border: none !important;
        }

        /* class to target vector path inside aircraft-drawing class */
        .aircraft-drawing path {
            fill: #007bff; /* fills plane with blue */
            stroke: #ffffff; /* adds white outline border */
            stroke-width: 1px; /* thickness of outline */
        }

        /* list view div, stays hidden until toggle to list */
        #list-view {
            display: none;
            width: 100vw !important;
            height: 100vh !important;
            background-color: white;
            position: relative;
            z-index: 5;
            box-sizing: border-box;
            padding-top: 90px;
            overflow-y: auto; /* enables vertical scrolling when table gets long */
            overflow-x: hidden; /* blocks horizontal left/right shifting */
        }

        /* aircraft table styling */
        #aircraft-table {
            width: 100%;
            border-collapse: collapse; 
            font-family: Arial, sans-serif;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background-color: white;
        }

        /* styling for table headers and data */
        #aircraft-table th, #aircraft-table td {
            border: 1px solid #e0e0e0;
            padding: 10px 8px; 
            text-align: center; 
            font-size: 13px; 
        }

        /* styling for table headers */
        #aircraft-table th {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        /* styling for alternating row colors */
        #aircraft-table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }
    </style>
</head>

<!-- body tag has all viewable content on the page -->
<body>
    <!-- HTML content here
    <h1>Welcome to the ADS-B Aircraft Tracker</h1>
    <p>This application allows you to track aircraft in real-time using ADS-B data.</p> -->

    <!-- shutdown button -->
    <button id = "shutdown-button" title = "Shutdown System">&#x23FB;</button>

    <!-- div for map and list view toggle buttons -->
    <div class = "toggle-container">
        <!-- map button starts as active -->
        <button id = "map-toggle-button" class = "toggle-button active">Map View</button>
        <button id = "list-toggle-button" class = "toggle-button">List View</button>
    </div>

    <!-- div for map and details panel (map view) -->
    <div id = "map-view">
        <!-- put this where want map to display -->
        <div id="map"></div>

        <!-- div for details panel -->
        <div id = "details-panel">
            <!-- button to close panel -->
            <button id = "close-details-button">&times;</button>

            <!-- Aircraft information -->
            <h2 id = "flight-details">Flight: </h2>
            <p><strong>ICAO Hex Code:</strong> <span id="details-hex">--</span></p>
            <p><strong>Altitude:</strong> <span id="details-altitude">--</span> m</p>
            <p><strong>Speed:</strong> <span id="details-speed">--</span> km/h</p>
            <p><strong>Heading:</strong> <span id="details-heading">--</span>&deg;</p>
            <p><strong>Latitude:</strong> <span id="details-latitude">--</span>&deg;</p>
            <p><strong>Longitude:</strong> <span id="details-longitude">--</span>&deg;</p>
            <p><strong>Squawk Code:</strong> <span id="details-squawk">--</span></p>
            <p><strong>Emergency Status:</strong> <span id="details-emergency">--</span></p>
            <p><strong>RSSI:</strong> <span id="details-rssi">--</span> dBFS</p>
        </div>
    </div>

    <!-- div for list view -->
    <div id = "list-view">
        <!-- <h2>Live Aircraft List</h2> -->

        <!-- table structure for displaying plane data -->
        <table id = "aircraft-table">
            <thead>
                <tr>
                    <th>Flight</th>
                    <th>ICAO Hex Code</th>
                    <th>Altitude (m)</th>
                    <th>Speed (km/h)</th>
                    <th>Heading (&deg;)</th>
                    <th>Latitude (&deg;)</th>
                    <th>Longitude (&deg;)</th>
                    <th>Squawk Code</th>
                    <th>Emergency Status</th>
                    <th>RSSI (dBFS)</th>
                </tr>
            </thead>
            <tbody id = "aircraft-table-body">
                <!-- JavaScript inserts table rows here -->
            </tbody>
        </table>
    </div>

    <!-- Leaflet JS library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    
    <!-- rest of JavaScript -->
    <script>
        // object to hold aircraft data and to keep aircraft across updates
        const aircraftMarkersByHex = {};

        // to keep track of which aircraft is currently selected in the details panel
        let activeAircraftHex = null;

        // constant coordinate path for B737.svg file, from https://github.com/RexKramer1/AircraftShapesSVG/tree/main
        const iconPath = "M 18.001116,0.04724702 17.457775,0.5905878 16.34747,4.2758555 16.040364,7.2760416 v 4.6538314 l -1.889881,1.299294 0.118118,-0.755953 -0.118114,-2.01981 -0.507906,-0.177176 -1.54734,0.09449 -0.118118,1.34654 -0.02362,1.464658 0.354353,1.34654 -11.0794271,5.693266 -0.77957585,0.732329 -0.33072917,0.803199 0.0708705,1.039435 0.12839448,0.0047 0.4259608,-0.88533 0.32573474,-0.30903 11.4041356,-3.227979 3.602586,-0.01181 v 4.984561 l 0.27167,2.716704 0.318918,1.594586 -5.468843,3.909692 -0.354353,0.590587 -0.118117,0.330729 0.02362,0.956752 6.815383,-2.149739 0.318918,0.826822 0.141741,0.03544 0.342541,-0.88588 6.839006,2.137925 V 32.63588 l -0.141741,-0.614209 -0.437035,-0.555154 -5.256231,-3.803385 0.377976,-1.807198 0.177176,-1.854445 0.05906,-0.838635 v -4.795573 l 3.472657,-0.01181 11.327472,3.212798 0.354354,0.259858 0.519719,0.992188 0.188986,0.03543 -0.02363,-1.263858 -0.271672,-0.696893 -0.566965,-0.590588 -0.708705,-0.437035 -10.606956,-5.409784 0.342541,-1.181176 0.01181,-1.807199 -0.224424,-1.086681 -1.511904,-0.08268 -0.555153,0.177176 -0.118117,1.122117 0.01181,0.87407 0.05906,0.661458 -1.700892,-1.240234 -0.02362,-3.9096919 -0.05906,-1.2520462 C 19.695879,4.1823419 19.163285,2.5956131 18.556265,0.55514753 Z"

        // initialize the map and set its view to a chosen geographical coordinates and zoom level
        // by default all mouse and touch interactions on the map are enabled
        var map = L.map('map').setView([51.0447, -114.0719], 9);
        
        // add a tile layer to the map (OpenStreetMap tiles)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // create empty layer for aircraft markers to easily manage
        const aircraftLayerGroup = L.layerGroup().addTo(map);

        // function to create new aircraft when detected
        function createNewAircraft(aircraft) {
            // create a new HTML table row
            const newRow = document.createElement('tr');

            // add new aircraft marker and data assigned to the hex key 
            aircraftMarkersByHex[aircraft.hex] = {
                marker: L.marker([aircraft.lat, aircraft.lon], {icon: createAircraftIcon(aircraft.track)}).addTo(aircraftLayerGroup),
                tableRow: newRow,
                info: aircraft,
                updated: Date.now(),
                hexNumberUsed: false,
            };

            // add empty row to HTML table
            document.getElementById('aircraft-table-body').appendChild(newRow);

            // check if flight number is missing and make popup with hex, need before to be able to reference popup with this.openPopup()
            if (aircraft.flight == null) {
                aircraftMarkersByHex[aircraft.hex].hexNumberUsed = true;
                aircraftMarkersByHex[aircraft.hex].marker.bindPopup(`ICAO Hex Code: ${aircraft.hex.trim().toUpperCase()}`);
            }

            // add flight number as a popup
            else {
                aircraftMarkersByHex[aircraft.hex].marker.bindPopup(aircraft.flight.trim());
                aircraftMarkersByHex[aircraft.hex].hexNumberUsed = false;                    
            }

            // add click event listener to marker to show details panel with aircraft info
            aircraftMarkersByHex[aircraft.hex].marker.on('click', function() {
                // save aircraft's hex code as active
                activeAircraftHex = aircraft.hex;

                // display details panel
                document.getElementById('details-panel').style.display = 'block';

                // update details panel
                updateDetailsPanel(aircraft);

                // open popup with flight number or hex code
                this.openPopup();
            })
        }

        // function to create aircraft icons with correct rotation based on heading
        function createAircraftIcon(heading) {
            // if no heading, default to 0 degrees (north)
            const angle = heading || 0;
            
            // define divIcon to return, use divIcon instead of icon to allow for colours and rotation
            return L.divIcon({
                html: `<svg viewBox="0 0 50 50" width="45" height="45" class="aircraft-drawing" style="transform: rotate(${angle}deg);">
                        <path d="${iconPath}" />
                        </svg>`,

                className: 'aircraft-marker-container', // clears Leaflet's white background
                iconSize: [40, 40], // width and height, keep equal because picture is square
                iconAnchor: [20, 20], // where sticker points to aircraft's position, exact center of image (half of iconSize)
                popupAnchor: [0, -20] // where popup is relative to iconAnchor (negative y is up)
            });
        }

        // function to update existing aircraft
        function updateExistingAircraft(aircraft) {
            // update object held at hex with new info and rotation
            aircraftMarkersByHex[aircraft.hex].marker.setLatLng([aircraft.lat, aircraft.lon]);
            aircraftMarkersByHex[aircraft.hex].marker.setIcon(createAircraftIcon(aircraft.track));
            aircraftMarkersByHex[aircraft.hex].info = aircraft;
            aircraftMarkersByHex[aircraft.hex].updated = Date.now();

            // if the popup currently uses the hex code but now have a flight number, update it
            // need to do this since when an aircraft is first detected it does not usually have flight number yet
            if (aircraft.flight && aircraft.flight.trim() !== "" && aircraftMarkersByHex[aircraft.hex].hexNumberUsed) {
                aircraftMarkersByHex[aircraft.hex].marker.setPopupContent(aircraft.flight.trim());
                aircraftMarkersByHex[aircraft.hex].hexNumberUsed = false;
            }

            // if this aircraft is open in details panel, update the panel with new data
            if (activeAircraftHex === aircraft.hex) {
                updateDetailsPanel(aircraft);
            }
        }

        // function to fill details panel with up to date info
        // ? is ternary operator that is a compact if else statement
        function updateDetailsPanel(aircraft) {
            document.getElementById('flight-details').textContent = "Flight: " + (aircraft.flight ? aircraft.flight.trim() : "N/A");
            document.getElementById('details-hex').textContent = aircraft.hex ? aircraft.hex.trim().toUpperCase() : "--";
            document.getElementById('details-altitude').textContent = aircraft.alt_baro !== null ? (aircraft.alt_baro * 0.3048).toFixed(0) : "--";
            document.getElementById('details-speed').textContent = aircraft.gs !== null ? (aircraft.gs * 1.852).toFixed(0) : "--"; 
            document.getElementById('details-heading').textContent = aircraft.track !== null ? aircraft.track : "--"; 
            document.getElementById('details-latitude').textContent = aircraft.lat !== null ? aircraft.lat.toFixed(4) : "--"; 
            document.getElementById('details-longitude').textContent = aircraft.lon !== null ? aircraft.lon.toFixed(4) : "--";
            document.getElementById('details-squawk').textContent = aircraft.squawk ? aircraft.squawk : "--";

            // update with emergency status using function to determine correctly
            document.getElementById('details-emergency').textContent = determineEmergencyStatus(aircraft);
            document.getElementById('details-rssi').textContent = aircraft.rssi ? aircraft.rssi : "--";
        }

        // function to update aircraft markers on the map based on new data
        function updateAllAircraft(aircraftList) {
            // loop through all aircraft and add/update markers
            for (const aircraft of aircraftList) {
                // check if lat or lon missing and move onto next aircraft
                if (aircraft.lat === null || aircraft.lon === null) {
                    continue;
                }
                
                // if already have aircraft icon, just update icon's position and heading
                if (aircraft.hex in aircraftMarkersByHex) {
                    updateExistingAircraft(aircraft);
                    
                // if newly tracked aircraft add to object (dictionary), add marker and add popup
                } else {
                    createNewAircraft(aircraft);
                }

                // grab specific table row element saved in dictionary
                const targetRow = aircraftMarkersByHex[aircraft.hex].tableRow;
                
                // grab info saved in dictionary for this aircraft
                const savedAircraftInfo = aircraftMarkersByHex[aircraft.hex].info;

                // update list view
                updateListView(targetRow, savedAircraftInfo);
            }

            // check for and delete old aircraft after 60 seconds of no new messages
            for (const key of Object.keys(aircraftMarkersByHex)) {
                const timeSinceUpdate = Date.now() - aircraftMarkersByHex[key].updated;
                if (timeSinceUpdate >= 60000) {
                    aircraftMarkersByHex[key].marker.remove();
                    // delete aircraft's table row (if it exists)
                    if (aircraftMarkersByHex[key].tableRow) {
                        aircraftMarkersByHex[key].tableRow.remove();
                    }
                    
                    lastRssi = aircraftMarkersByHex[key].info.rssi;
                    delete aircraftMarkersByHex[key];
                    console.log(`Deleted ${key} after ${timeSinceUpdate} ms with last RSSI of ${lastRssi} dBFS`);
                }
            }
        }

        // function to update list view table with aircraft data
        function updateListView(rowElement, aircraft) {
            const flightNum = aircraft.flight ? aircraft.flight.trim() : "N/A";
            const hexCode = aircraft.hex ? aircraft.hex.trim().toUpperCase() : "--";
            const altitude = aircraft.alt_baro !== null ? (aircraft.alt_baro * 0.3048).toFixed(0) : "--";
            const speed = aircraft.gs !== null ? (aircraft.gs * 1.852).toFixed(0) : "--";
            const heading = aircraft.track !== null ? aircraft.track : "--";
            const latitude = aircraft.lat !== null ? aircraft.lat.toFixed(4) : "--";
            const longitude = aircraft.lon !== null ? aircraft.lon.toFixed(4) : "--";
            const squawk = aircraft.squawk ? aircraft.squawk : "--";

            // update with emergency status using function to determine correctly
            const emergencyStatus = determineEmergencyStatus(aircraft);

            const rssi = aircraft.rssi ? aircraft.rssi : "--";

            // overwrite text cells inside aircraft's table row in HTML
            rowElement.innerHTML = `
                <td>${flightNum}</td>
                <td>${hexCode}</td>
                <td>${altitude}</td>
                <td>${speed}</td>
                <td>${heading}</td>
                <td>${latitude}</td>
                <td>${longitude}</td>
                <td>${squawk}</td>
                <td>${emergencyStatus}</td>
                <td>${rssi}</td>
            `;
        }

        // function to determine correct emergency status
        function determineEmergencyStatus(aircraft) {
            let emergencyStatus = "None";

            // if emergency is not null or "none", then use emergency info
            if (aircraft.emergency && aircraft.emergency !== "none") {
                emergencyStatus = aircraft.emergency.toUpperCase();
               
            // if squawk code tells of emergency, use that
            } else if (aircraft.squawk) {
                const squawkCode = String(aircraft.squawk).trim();
                if (squawkCode === "7700") emergencyStatus = "GENERAL EMERGENCY";
                if (squawkCode === "7600") emergencyStatus = "RADIO FAILURE";
                if (squawkCode === "7500") emergencyStatus = "HIJACKING ALERT";
            }

            return emergencyStatus;
        }

        // function to fetch and display aircrafts
        async function fetchAircraftData() {
            try {
                // fetch aircraft data from the API, use relative url since browser already knows it is talking to Flask server (not reliant on Pi's IP)
                const response = await fetch('/data');
                const data = await response.json();

                // get data for all aircraft only (remove messages and now outputs)
                const aircraftList = data.aircraft;
                
                // update all aircraft markers on the map and list view with new data
                updateAllAircraft(aircraftList);

            // if cannot fetch from API, log error to console
            } catch (error) {
                console.error('Error fetching aircraft data:', error);
            
            // always executes each time
            } finally {
                // call the function recursively again after 1 second to update aircraft data since dump1090 updates aircraft.json once every second
                setTimeout(fetchAircraftData, 1000);
            }
        }

        // call the function initially when page loads to fetch and display aircraft data
        fetchAircraftData()

        // get toggle buttons by id
        const mapToggleButton = document.getElementById('map-toggle-button');
        const listToggleButton = document.getElementById('list-toggle-button');

        // get both view containers by id
        const mapViewContainer = document.getElementById('map-view');
        const listViewContainer = document.getElementById('list-view');

        // listener for map toggle button
        mapToggleButton.addEventListener('click', function() {
            // show map view and hide list view
            mapViewContainer.style.display = "block";
            listViewContainer.style.display = "none";

            // update button styles to show which is active
            mapToggleButton.classList.add('active');
            listToggleButton.classList.remove('active');

            // force map to recalculate screen width to fit screen correctly
            setTimeout(function() {
                map.invalidateSize();
            }, 50);
        });

        // listener for list toggle button
        listToggleButton.addEventListener('click', function() {
            // show list view and hide map view
            mapViewContainer.style.display = "none";
            listViewContainer.style.display = "block";

            // update button styles to show which is active
            mapToggleButton.classList.remove('active');
            listToggleButton.classList.add('active');
        });

        // listener to shutdown Pi
        document.getElementById('shutdown-button').addEventListener('click', function() {
            // popup to confirm the user wants to shutdown
            if (confirm("Are you sure you want to shutdown?")) {
                // fetchs for a respons from the server using post (instead of GET)
                fetch('/shutdown', { method: 'POST' })
                    // if server successfully answers, then run shutdown
                    .then(response => {
                        // if server responds with ok, alert user that shutdown command sent
                        if (response.ok) {
                            alert("Shutdown command sent. The system will shutdown shortly.");
                        // if server responds with error, alert user of failure
                        } else {
                            alert("Failed to send shutdown command.");
                        }
                    })
                    
                    // if fetch fails, log error to console and alert user
                    .catch(error => {
                        console.error('Error sending shutdown command:', error);
                        alert("Error sending shutdown command.");
                    });
            }
        })

        // listener to hide details panel and clear active aircraft when click close button
        document.getElementById('close-details-button').addEventListener('click', function() {
            document.getElementById('details-panel').style.display = 'none';
            activeAircraftHex = null; 
        });
    </script>
</body>
</html>
